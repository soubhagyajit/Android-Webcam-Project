name: Linux client

on:
  workflow_dispatch:
  push:
    paths:
      - "CLIENT/tauri-client/**"
      - ".github/workflows/linux-client.yml"
  pull_request:
    paths:
      - "CLIENT/tauri-client/**"
      - ".github/workflows/linux-client.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: CLIENT/tauri-client/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            patchelf \
            libayatana-appindicator3-dev \
            libv4l-dev \
            pkg-config \
            clang \
            cmake \
            libssl-dev \
            build-essential \
            xdg-utils \
            software-properties-common

      # ffmpeg-next 8.1.0 needs FFmpeg 8 headers. Ubuntu 24.04 ships FFmpeg 6.
      - name: Install FFmpeg 8
        run: |
          sudo add-apt-repository -y ppa:ubuntuhandbook1/ffmpeg8
          sudo apt-get update
          sudo apt-get install -y -t "o=LP-PPA-ubuntuhandbook1-ffmpeg8" \
            ffmpeg \
            libavcodec-dev \
            libavformat-dev \
            libavutil-dev \
            libavfilter-dev \
            libavdevice-dev \
            libswscale-dev \
            libswresample-dev

      - name: Install frontend dependencies
        working-directory: CLIENT/tauri-client
        run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: CLIENT/tauri-client
          args: --bundles deb,appimage

      - uses: actions/upload-artifact@v4
        with:
          name: linux-client
          path: |
            CLIENT/tauri-client/src-tauri/target/release/bundle/deb/*.deb
            CLIENT/tauri-client/src-tauri/target/release/bundle/appimage/*.AppImage
